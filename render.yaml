# Use a Background Worker so the Discord bot stays running 24/7 without spin-down.
# (Web Service on free tier sleeps after ~15 min without HTTP traffic; Background Worker does not.)
services:
  - type: worker
    name: gv-legacy-general-mod
    runtime: node
    # ffmpeg helps @discordjs/voice decode ElevenLabs MP3 for Midland POWER TTS playback.
    # Use npm (package-lock.json). @discordjs/voice@0.19 needs Node 22.12+.
    buildCommand: apt-get update && apt-get install -y ffmpeg && npm ci
    startCommand: npm start
    envVars:
      - key: DISCORD_TOKEN
        sync: false
      - key: NODE_VERSION
        value: "22.20.2"
